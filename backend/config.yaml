# ============================================================
# News Curator 설정 파일 (NFR-E03)
# ============================================================
# 코드 수정 없이 이 파일의 값만 변경하여 동작을 조정할 수 있다.
# API 키 등 민감 정보는 .env 파일에서 관리한다.

# ── LLM 엔진 설정 ──
llm:
  # CT-01: 3줄 요약 (Llama 로컬)
  summarizer:
    model: "llama3"
    base_url: "http://localhost:11434/v1"
    max_tokens: 1024
    temperature: 0.3

  # CT-02: 카테고리 분류 (GPT API)
  classifier:
    model: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
    max_tokens: 512
    temperature: 0.1

# ── 추천 알고리즘 가중치 ──
recommendation:
  weight_embedding: 0.40
  weight_recency: 0.20
  weight_subscription: 0.20
  weight_reliability: 0.20
  weight_dislike_penalty: 0.25
  subscription_boost_multiplier: 1.3
  subscription_track_limit: 10

# ── 기사 카테고리 (8종) ──
categories:
  - "정치"
  - "경제"
  - "사회"
  - "IT·과학"
  - "생활·문화"
  - "세계"
  - "연예"
  - "스포츠"
